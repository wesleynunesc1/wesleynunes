<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 3600" width="1200" height="3600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0D11" />
      <stop offset="50%" stop-color="#11151D" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A9C8D8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#D9D9D9" />
      <stop offset="100%" stop-color="#8892B0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="3600" fill="url(#bg)" />

  <!-- Atmospheric Glows -->
  <circle cx="200" cy="400" r="450" fill="url(#glow)" filter="blur(60px)" />
  <circle cx="1000" cy="1800" r="500" fill="url(#glow)" filter="blur(80px)" />
  <circle cx="300" cy="3000" r="400" fill="url(#glow)" filter="blur(60px)" />

  <!-- Header Section Mockup -->
  <g transform="translate(100, 80)">
    <rect width="1000" height="80" rx="40" fill="#151922" stroke="#252D3D" stroke-width="1.5" />
    <text x="60" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="2">LUMINA</text>
    <text x="500" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#A9C8D8" letter-spacing="1">STUDIO • ARCHITECTURE • SPACES • ABOUT</text>
    <rect x="850" y="20" width="110" height="40" rx="20" fill="#A9C8D8" />
    <text x="880" y="45" font-family="sans-serif" font-size="14" font-weight="600" fill="#0B0D11">CONTACT</text>
  </g>

  <!-- Hero Section -->
  <g transform="translate(140, 360)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#1C2331" stroke="#A9C8D8" stroke-opacity="0.3" />
    <text x="25" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#A9C8D8" letter-spacing="1">ARCHITECTURAL DESIGN</text>
    
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="300" fill="#FFFFFF" letter-spacing="-1">Designing spaces</text>
    <text x="0" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="600" fill="url(#silver)" letter-spacing="-1">where light meets stone.</text>
    
    <text x="0" y="300" font-family="sans-serif" font-size="22" fill="#8892B0" max-width="800">Transforming physical volume into sensorial spatial experiences across the world.</text>

    <!-- Visual Showcase Box -->
    <rect x="0" y="380" width="920" height="480" rx="24" fill="#161B26" stroke="#232B3C" stroke-width="1.5" />
    <rect x="40" y="420" width="400" height="400" rx="16" fill="#202738" />
    <text x="70" y="630" font-family="sans-serif" font-size="24" font-weight="300" fill="#D9D9D9">Minimalist Villa</text>
    <text x="70" y="665" font-family="sans-serif" font-size="16" fill="#A9C8D8">Zurich, Switzerland — 2025</text>
    <rect x="480" y="420" width="400" height="400" rx="16" fill="#1B2232" />
    <text x="510" y="630" font-family="sans-serif" font-size="24" font-weight="300" fill="#D9D9D9">Gallery Pavilion</text>
    <text x="510" y="665" font-family="sans-serif" font-size="16" fill="#A9C8D8">Kyoto, Japan — 2025</text>
  </g>

  <!-- Mid Section - Interactive Grid -->
  <g transform="translate(140, 1400)">
    <text x="0" y="0" font-family="sans-serif" font-size="16" font-weight="600" fill="#A9C8D8" letter-spacing="2">02 / EXPERIENCES</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="300" fill="#FFFFFF">Precision in every detail.</text>
    
    <rect x="0" y="120" width="440" height="520" rx="20" fill="#141822" stroke="#232B3C" />
    <text x="40" y="190" font-family="sans-serif" font-size="28" fill="#FFFFFF">Spatial Acoustics</text>
    <text x="40" y="240" font-family="sans-serif" font-size="16" fill="#8892B0" width="360">Computational acoustic optimization using generative modeling algorithms.</text>
    
    <rect x="480" y="120" width="440" height="520" rx="20" fill="#141822" stroke="#232B3C" />
    <text x="520" y="190" font-family="sans-serif" font-size="28" fill="#FFFFFF">Biophilic Light</text>
    <text x="520" y="240" font-family="sans-serif" font-size="16" fill="#8892B0" width="360">Natural illumination pathways that harmoniously respect circadian rhythms.</text>
  </g>

  <!-- Gallery Section -->
  <g transform="translate(140, 2200)">
    <text x="0" y="0" font-family="sans-serif" font-size="16" font-weight="600" fill="#A9C8D8" letter-spacing="2">03 / ARCHIVE</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="300" fill="#FFFFFF">Selected Global Works</text>

    <rect x="0" y="120" width="920" height="280" rx="16" fill="#121620" stroke="#1F2636" />
    <text x="50" y="220" font-family="sans-serif" font-size="32" fill="#D9D9D9">01 • Nordic Pavilion — Oslo</text>
    <text x="50" y="260" font-family="sans-serif" font-size="18" fill="#A9C8D8">Cultural Center • Completed 2024</text>

    <rect x="0" y="440" width="920" height="280" rx="16" fill="#121620" stroke="#1F2636" />
    <text x="50" y="540" font-family="sans-serif" font-size="32" fill="#D9D9D9">02 • Horizon Residence — California</text>
    <text x="50" y="580" font-family="sans-serif" font-size="18" fill="#A9C8D8">Private Living • Completed 2025</text>
  </g>

  <!-- Footer Section -->
  <g transform="translate(140, 3200)">
    <line x1="0" y1="0" x2="920" y2="0" stroke="#252D3D" stroke-width="1.5" />
    <text x="0" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="300" fill="#FFFFFF">Let's build something enduring.</text>
    <text x="0" y="160" font-family="sans-serif" font-size="20" fill="#A9C8D8">hello@lumina.architecture</text>
    <text x="0" y="240" font-family="sans-serif" font-size="15" fill="#5A6578">© 2026 Lumina Architecture Studio. All rights reserved.</text>
  </g>
</svg>
