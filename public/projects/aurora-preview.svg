<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 3600" width="1200" height="3600">
  <defs>
    <linearGradient id="aurora-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080B10" />
      <stop offset="40%" stop-color="#0E141D" />
      <stop offset="100%" stop-color="#06080B" />
    </linearGradient>
    <linearGradient id="aurora-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="aurora-card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141B26" />
      <stop offset="100%" stop-color="#0E131C" />
    </linearGradient>
  </defs>

  <rect width="1200" height="3600" fill="url(#aurora-bg)" />
  <circle cx="950" cy="500" r="400" fill="#38BDF8" opacity="0.12" filter="blur(70px)" />
  <circle cx="200" cy="2100" r="450" fill="#6EE7B7" opacity="0.08" filter="blur(80px)" />

  <!-- Nav -->
  <g transform="translate(120, 70)">
    <text x="0" y="45" font-family="sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" letter-spacing="3">AURORA</text>
    <text x="500" y="45" font-family="sans-serif" font-size="15" fill="#94A3B8">CAPITAL • WEALTH • ANALYTICS • INSTITUTIONAL</text>
    <rect x="840" y="15" width="120" height="42" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
    <text x="865" y="42" font-family="sans-serif" font-size="14" fill="#38BDF8" font-weight="600">CLIENT PORTAL</text>
  </g>

  <!-- Hero Section -->
  <g transform="translate(120, 320)">
    <rect x="0" y="0" width="180" height="30" rx="15" fill="#132433" stroke="#38BDF8" stroke-width="1" />
    <text x="20" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#38BDF8" letter-spacing="1.5">INTELLIGENT CAPITAL</text>

    <text x="0" y="110" font-family="sans-serif" font-size="64" font-weight="300" fill="#FFFFFF">Institutional-grade</text>
    <text x="0" y="185" font-family="sans-serif" font-size="64" font-weight="700" fill="url(#aurora-cyan)">wealth management.</text>
    <text x="0" y="260" font-family="sans-serif" font-size="20" fill="#94A3B8">Autonomous risk mitigation, algorithmic alpha generation and bespoke advisory.</text>

    <!-- Financial Chart Box -->
    <rect x="0" y="320" width="960" height="520" rx="20" fill="url(#aurora-card-bg)" stroke="#1E293B" stroke-width="1.5" />
    <text x="50" y="380" font-family="sans-serif" font-size="16" fill="#64748B" letter-spacing="1">PORTFOLIO AGGREGATE PERFORMANCE</text>
    <text x="50" y="430" font-family="sans-serif" font-size="44" font-weight="600" fill="#FFFFFF">$48,290,410.00</text>
    <text x="430" y="430" font-family="sans-serif" font-size="20" font-weight="600" fill="#34D399">+ 24.8% YTD</text>

    <!-- Graph Line -->
    <path d="M 50 680 Q 250 640 400 580 T 700 500 T 910 460" fill="none" stroke="#38BDF8" stroke-width="4" />
    <path d="M 50 720 Q 250 700 400 660 T 700 620 T 910 600" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 6" />
  </g>

  <!-- Metrics -->
  <g transform="translate(120, 1340)">
    <rect x="0" y="0" width="300" height="200" rx="16" fill="#101722" stroke="#1E293B" />
    <text x="35" y="70" font-family="sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">$2.4B+</text>
    <text x="35" y="120" font-family="sans-serif" font-size="15" fill="#94A3B8">Assets under advice</text>

    <rect x="330" y="0" width="300" height="200" rx="16" fill="#101722" stroke="#1E293B" />
    <text x="365" y="70" font-family="sans-serif" font-size="44" font-weight="700" fill="#38BDF8">99.98%</text>
    <text x="365" y="120" font-family="sans-serif" font-size="15" fill="#94A3B8">Platform reliability SLA</text>

    <rect x="660" y="0" width="300" height="200" rx="16" fill="#101722" stroke="#1E293B" />
    <text x="695" y="70" font-family="sans-serif" font-size="44" font-weight="700" fill="#6EE7B7">140+</text>
    <text x="695" y="120" font-family="sans-serif" font-size="15" fill="#94A3B8">Family office accounts</text>
  </g>

  <!-- Deep Architecture Features -->
  <g transform="translate(120, 1920)">
    <text x="0" y="40" font-family="sans-serif" font-size="36" font-weight="300" fill="#FFFFFF">Institutional Infrastructure</text>
    <rect x="0" y="80" width="960" height="380" rx="16" fill="#0D131C" stroke="#1A2433" />
    <text x="50" y="160" font-family="sans-serif" font-size="24" fill="#FFFFFF">Multi-Jurisdictional Vault Custody</text>
    <text x="50" y="210" font-family="sans-serif" font-size="16" fill="#94A3B8" max-width="800">Cold-storage algorithmic key distribution, verified by zero-knowledge cryptographic proofs.</text>

    <rect x="0" y="500" width="960" height="380" rx="16" fill="#0D131C" stroke="#1A2433" />
    <text x="50" y="580" font-family="sans-serif" font-size="24" fill="#FFFFFF">Real-time Tax Alpha Harvesting</text>
    <text x="50" y="630" font-family="sans-serif" font-size="16" fill="#94A3B8" max-width="800">Automated asset replacement strategies continuously optimizing fiscal efficiency across global portfolios.</text>
  </g>

  <!-- Footer -->
  <g transform="translate(120, 3200)">
    <line x1="0" y1="0" x2="960" y2="0" stroke="#1E293B" />
    <text x="0" y="100" font-family="sans-serif" font-size="48" font-weight="300" fill="#FFFFFF">Begin your institutional journey.</text>
    <text x="0" y="160" font-family="sans-serif" font-size="20" fill="#38BDF8">advisory@aurorawealth.ch</text>
    <text x="0" y="240" font-family="sans-serif" font-size="14" fill="#475569">© 2026 Aurora Wealth AG. Regulated Swiss Asset Management.</text>
  </g>
</svg>

